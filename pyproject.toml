[project]
name = "docx-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for reading and editing Microsoft Word (.docx) documents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "bagushd" }
]
requires-python = ">=3.12"
dependencies = [
    "latex2mathml>=3.81.1",
    "mathml2omml>=0.0.2",
    "mcp[cli]>=2.3.0",
    "python-docx>=1.2.0",
]

[project.scripts]
docx-mcp = "docx_mcp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
